<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Limpiar Caché - Sistema de Trabajos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 500px;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
        }

        .status {
            padding: 15px;
            margin: 20px 0;
            border-radius: 10px;
            font-weight: bold;
        }

        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            margin: 10px;
            transition: background 0.3s;
        }

        button:hover {
            background: #0056b3;
        }

        .countdown {
            font-size: 24px;
            font-weight: bold;
            color: #007bff;
            margin: 20px 0;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🧹 Limpiando Caché del Sistema</h1>

        <div id="status" class="status info">
            Iniciando limpieza de caché...
        </div>

        <div id="countdown" class="countdown"></div>

        <button onclick="forceRedirect()">Ir al Sistema Ahora</button>
        <button onclick="clearAndRedirect()">Limpiar y Recargar</button>
    </div>

    <script>
        let countdown = 5;
        const statusEl = document.getElementById('status');
        const countdownEl = document.getElementById('countdown');

        function updateStatus(message, type = 'info') {
            statusEl.textContent = message;
            statusEl.className = `status ${type}`;
        }

        function updateCountdown() {
            countdownEl.textContent = `Redirigiendo en ${countdown} segundos...`;
        }

        function clearCache() {
            updateStatus('Limpiando localStorage...', 'info');
            localStorage.clear();

            updateStatus('Limpiando sessionStorage...', 'info');
            sessionStorage.clear();

            updateStatus('Limpiando cookies...', 'info');
            document.cookie.split(";").forEach(function (c) {
                document.cookie = c.replace(/^ +/, "").replace(/=.*/, "=;expires=" + new Date().toUTCString() + ";path=/");
            });

            updateStatus('Caché limpiado exitosamente!', 'success');
        }

        function forceRedirect() {
            const timestamp = Date.now();
            window.location.href = `http://localhost:3000/dashboard/schedule?t=${timestamp}&nocache=true`;
        }

        function clearAndRedirect() {
            clearCache();
            setTimeout(() => {
                forceRedirect();
            }, 1000);
        }

        // Limpiar caché automáticamente
        clearCache();

        // Countdown automático
        const timer = setInterval(() => {
            updateCountdown();
            countdown--;

            if (countdown <= 0) {
                clearInterval(timer);
                forceRedirect();
            }
        }, 1000);

        updateCountdown();
    </script>
</body>

</html>
